name: ARCA M5-M — cobertura PNCP contratos/empenhos
run-name: M5-M PNCP contract coverage live — ${{ github.run_id }}

on:
  push:
    branches:
      - 'm5-pncp-contract-coverage-live-c*'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter revisão autorizada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Extrair candidateSha256 do branch
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'
          if [[ "$ref" =~ ^m5-pncp-contract-coverage-live-c([a-f0-9]{64})$ ]]; then
            echo "ARCA_M5_M_CANDIDATE_SHA256=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "ARCA_M5_M_BRANCH_BINDING_INVALID" >&2
            exit 1
          fi

      - name: Preparar Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Instalar dependências travadas
        run: npm ci

      - name: Validar contrato M5-M
        run: npm run validate:m5-pncp-contract-coverage

      - name: Transportar normalização PNCP criptografada já existente
        env:
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
        run: |
          set -euo pipefail
          node scripts/fetch-m5-private-screening-envelope.mjs \
            --source PNCP \
            --output artifacts/private/pncp.envelope.json

      - name: Executar exatamente os 2 GETs PNCP autorizados e custodiar
        env:
          ARCA_M5_M_CONFIRMATION: PNCP_CONTRACT_COVERAGE_GET_ONLY
          ARCA_M5_M_CANDIDATE_SHA256: ${{ env.ARCA_M5_M_CANDIDATE_SHA256 }}
          ARCA_PNCP_CUSTODY_PASSPHRASE: ${{ secrets.ARCA_PNCP_CUSTODY_PASSPHRASE }}
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/proof
          node scripts/run-m5-pncp-contract-coverage-live.mjs \
            --pncp-envelope artifacts/private/pncp.envelope.json \
            --output artifacts/proof/m5-pncp-contract-coverage-proof.json

      - name: Publicar somente prova sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: m5-pncp-contract-coverage-proof-${{ github.run_id }}
          path: artifacts/proof/m5-pncp-contract-coverage-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Limpar material privado
        if: always()
        run: rm -rf artifacts/private
