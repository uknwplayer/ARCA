name: ARCA Portal document secret diagnostic 001

on:
  push:
    branches:
      - ops/portal-document-secret-diagnostic-001

permissions:
  contents: read

jobs:
  diagnose-document-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Diagnose document-code secret hash only
        env:
          ARCA_PORTAL_DOCUMENT_CODE: ${{ secrets.ARCA_PORTAL_DOCUMENT_CODE }}
        run: |
          node - <<'NODE'
          const {createHash}=require("node:crypto");
          const v=process.env.ARCA_PORTAL_DOCUMENT_CODE ?? "";
          const h=createHash("sha256").update(v).digest("hex");
          const expected="dbd99670efc9b5e4cc03c859dceb2dac203bb564d8f393b8f1e167dc829e208e";
          const candidates={
            plain: expected,
            double_quotes:"67dc513ca9112e20904d206d47f015d349b44b947e102f8b0140b4a24bda6675",
            single_quotes:"0f1b91c54090bccbc7d2ba0eab4f7ec9cfd23f678ff68028fe2fcec5e83be504",
            backticks:"53c4d128d6eea7531df8272f0d1a59e6ee12554b68b044189664d1ec2d3d61e3",
            leading_space:"a46f5a4b53255e43f53c4fc87b8cc70dfb33ff2288a1483f7ab7d1e2f8812a0c",
            trailing_space:"91191aded84f18c841044b12aa7600f448ba98543b602b2d269471b26c85a6f6"
          };
          const match=Object.entries(candidates).find(([,x])=>x===h)?.[0] ?? "other";
          console.log(JSON.stringify({
            secretPresent:v.length>0,
            length:v.length,
            sha256:h,
            expectedSha256:expected,
            expectedMatch:h===expected,
            likelyFormat:match
          }));
          if(!v.length) process.exitCode=2;
          else if(h!==expected) process.exitCode=3;
          NODE
