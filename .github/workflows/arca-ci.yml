name: ARCA 0.4.0 RC1 CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arca-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22.18 — full test suite and repository check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Run Executor Mesh contract tests
        run: PYTHONPATH=. python -m unittest discover -s tests/executor_mesh -v

      - name: Run investigative roadmap controlled pilot
        run: PYTHONPATH=. python scripts/validate-investigative-roadmap.py

      - name: Run offline multisource gate
        run: npm run validate:multisource

      - name: Run offline financial correlation gate
        run: npm run validate:financial-correlation

      - name: Run correlated multisource offline gate
        run: npm run validate:multisource-correlated

      - name: Executar gate TCU Acórdãos offline S2
        run: npm run validate:tcu-s2

      - name: Run M5 Phase A pre-correlation gate
        run: npm run validate:m5-phase-a

      - name: Run M5 Phase B post-custody gate
        run: npm run validate:m5-phase-b

      - name: Executar gate M5 Fase C de observação do schema Portal
        run: npm run validate:m5-phase-c

      - name: Executar parser Portal offline M5-F
        run: npm run validate:m5-portal-parser

      - name: Executar gate M5-G de admissão do parser Portal
        run: npm run validate:m5-parser-admission

      - name: Validar admissão humana M5-H para normalização custodial
        run: npm run validate:m5-custodial-admission

      - name: Validar binding live normalizado Portal M5-I
        run: npm run validate:m5-live-normalized-binding

      - name: Validar parser PNCP live observado
        run: npm run validate:m5-pncp-live-parser

      - name: Validar autorização da normalização PNCP
        run: npm run validate:m5-pncp-normalization-auth

      - name: Validar binding PNCP live normalizado M5-J
        run: npm run validate:m5-pncp-live-binding

      - name: Validar gate M5-K de prontidão de correlação
        run: npm run validate:m5-correlation-readiness

      - name: Validar contrato M5-L de triagem privada
        run: npm run validate:m5-private-screening-contract

      - name: Validar gate M5-M de cobertura PNCP contratos/empenhos
        run: npm run validate:m5-pncp-contract-coverage

      - name: Validar diagnóstico offline M5-M HTTP 400
        run: npm run validate:m5-m-http400-diagnosis






      - name: Executar gate M5 Fase D de prontidão da credencial Portal
        run: npm run validate:m5-phase-d

      - name: Validar preflight Portal isolado sem captura
        run: npm run validate:portal-isolated-preflight

      - name: Executar gate M5 Fase E de binding do preflight
        run: npm run validate:m5-phase-e

      - name: Verify repository and approved custody pilot
        shell: bash
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            npm run check
          else
            npm run check:public
          fi

      - name: Build public repository preview
        if: github.event_name != 'push'
        run: npm run publication:preview

      - name: Upload public repository preview
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: arca-publication-preview-${{ github.run_id }}
          path: .arca-publication-preview/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
