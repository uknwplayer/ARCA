name: ARCA Investigative Mesh006 Live Proof
run-name: Investigative Mesh006 live proof ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute sanitized four-child live proof
        env:
          ARCA_GITHUB_DISPATCH_TOKEN: ${{ secrets.ARCA_SATELLITE_DISPATCH_TOKEN }}
          ARCA_MISSION_ID: investigative-mesh006-live-${{ github.run_id }}
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/arca-investigative-mesh006-live.py | tee investigative-mesh006-live-proof.json
      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigative-mesh006-live-proof-${{ github.run_id }}
          path: investigative-mesh006-live-proof.json
          if-no-files-found: warn
          retention-days: 30
