name: ARCA Portal related-documents controlled probe
run-name: Portal documents probe run ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact authorization for one Portal documents GET
        required: true
        type: string
      scope_sha256:
        description: Reviewed v0.2 scope SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Validate reviewed scope and private vault without Portal access
        env:
          ARCA_PORTAL_CONFIRMATION: ${{ inputs.confirmation }}
          ARCA_PORTAL_SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          ARCA_PORTAL_DOCUMENT_CODE: ${{ secrets.ARCA_PORTAL_DOCUMENT_CODE }}
          ARCA_PORTAL_API_KEY: ${{ secrets.ARCA_PORTAL_API_KEY }}
          ARCA_PORTAL_CUSTODY_PASSPHRASE: ${{ secrets.ARCA_PORTAL_CUSTODY_PASSPHRASE }}
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/arca-portal-related-documents-live-probe.mjs --preflight-only

      - name: Capture one bounded Portal response
        env:
          ARCA_PORTAL_CONFIRMATION: ${{ inputs.confirmation }}
          ARCA_PORTAL_SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          ARCA_PORTAL_DOCUMENT_CODE: ${{ secrets.ARCA_PORTAL_DOCUMENT_CODE }}
          ARCA_PORTAL_API_KEY: ${{ secrets.ARCA_PORTAL_API_KEY }}
          ARCA_PORTAL_CUSTODY_PASSPHRASE: ${{ secrets.ARCA_PORTAL_CUSTODY_PASSPHRASE }}
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/arca-portal-related-documents-live-probe.mjs

      - name: Upload encrypted envelope and sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-related-documents-${{ github.run_id }}
          path: |
            artifacts/portal-related-documents.envelope.json
            artifacts/portal-related-documents-proof.json
          if-no-files-found: ignore
          retention-days: 7
