name: ARCA Portal — probe controlado de documentos relacionados
run-name: Probe Portal controlado — execução ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Autorização exata para um único GET de documentos do Portal
        required: true
        type: string
      scope_sha256:
        description: SHA-256 do escopo v0.2 revisado
        required: true
        type: string
      preflight_sha256:
        description: SHA-256 da atestação do Gate 040 revisada
        required: true
        type: string
      credential_fingerprint_sha256:
        description: Fingerprint SHA-256 da credencial exibido pelo Gate 040
        required: true
        type: string
      token_provenance:
        description: Deve ser exatamente OFFICIAL_EMAIL_REGISTRATION
        required: true
        type: string
      token_received_at:
        description: Instante UTC declarado em que o token foi recebido por e-mail
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter a revisão analisada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preparar Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Instalar dependências travadas
        run: npm ci

      - name: Validar escopo, credencial e cofre privado sem acessar o Portal
        env:
          ARCA_PORTAL_CONFIRMATION: ${{ inputs.confirmation }}
          ARCA_PORTAL_SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          ARCA_PORTAL_PREFLIGHT_SHA256: ${{ inputs.preflight_sha256 }}
          ARCA_PORTAL_CREDENTIAL_FINGERPRINT_SHA256: ${{ inputs.credential_fingerprint_sha256 }}
          ARCA_PORTAL_DOCUMENT_CODE: ${{ secrets.ARCA_PORTAL_DOCUMENT_CODE }}
          ARCA_PORTAL_API_KEY: ${{ secrets.ARCA_PORTAL_API_KEY }}
          ARCA_PORTAL_TOKEN_PROVENANCE: ${{ inputs.token_provenance }}
          ARCA_PORTAL_TOKEN_RECEIVED_AT: ${{ inputs.token_received_at }}
          ARCA_PORTAL_CUSTODY_PASSPHRASE: ${{ secrets.ARCA_PORTAL_CUSTODY_PASSPHRASE }}
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/arca-portal-related-documents-live-probe.mjs --preflight-only

      - name: Capturar uma única resposta limitada do Portal
        env:
          ARCA_PORTAL_CONFIRMATION: ${{ inputs.confirmation }}
          ARCA_PORTAL_SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          ARCA_PORTAL_PREFLIGHT_SHA256: ${{ inputs.preflight_sha256 }}
          ARCA_PORTAL_CREDENTIAL_FINGERPRINT_SHA256: ${{ inputs.credential_fingerprint_sha256 }}
          ARCA_PORTAL_DOCUMENT_CODE: ${{ secrets.ARCA_PORTAL_DOCUMENT_CODE }}
          ARCA_PORTAL_API_KEY: ${{ secrets.ARCA_PORTAL_API_KEY }}
          ARCA_PORTAL_TOKEN_PROVENANCE: ${{ inputs.token_provenance }}
          ARCA_PORTAL_TOKEN_RECEIVED_AT: ${{ inputs.token_received_at }}
          ARCA_PORTAL_CUSTODY_PASSPHRASE: ${{ secrets.ARCA_PORTAL_CUSTODY_PASSPHRASE }}
          ARCA_CUSTODY_VAULT_REPOSITORY: ${{ secrets.ARCA_CUSTODY_VAULT_REPOSITORY }}
          ARCA_CUSTODY_VAULT_TOKEN: ${{ secrets.ARCA_CUSTODY_VAULT_TOKEN }}
          ARCA_CUSTODY_VAULT_BRANCH: ${{ secrets.ARCA_CUSTODY_VAULT_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/arca-portal-related-documents-live-probe.mjs

      - name: Enviar envelope criptografado e prova sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-related-documents-${{ github.run_id }}
          path: |
            artifacts/portal-related-documents.envelope.json
            artifacts/portal-related-documents-proof.json
          if-no-files-found: ignore
          retention-days: 7
