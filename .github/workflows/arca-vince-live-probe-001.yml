name: ARCA Vince Live Probe 001
run-name: Vince Pathfinder live probe 001

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: arca-vince-live-probe-001
  cancel-in-progress: false

jobs:
  vince-pathfinder:
    if: >-
      github.event.issue.number == 109 &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'uknwplayer' &&
      github.event.comment.body == 'ARCA_VINCE_LIVE_PROBE_001_EXECUTE'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout canonical ARCA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Vince Pathfinder satellite proof
        env:
          ARCA_GITHUB_DISPATCH_TOKEN: ${{ secrets.ARCA_SATELLITE_DISPATCH_TOKEN }}
          ARCA_CONTROL_REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=. python scripts/arca-vince-pathfinder-probe.py \
            --mission-id vince-live-001 \
            --force-satellite \
            --collect-timeout 240 \
            --poll-seconds 3

      - name: Upload Vince proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vince-pathfinder-live-001-${{ github.run_id }}
          path: artifacts/vince-pathfinder-live-proof.json
          if-no-files-found: ignore
          retention-days: 14
